# Indus Broadband (Next.js static export).
# LIVE ON: vm-sites (10.10.10.3) at /etc/nginx/sites-available/indusbroadband.com.pk
# TLS terminates on ct-edge (10.10.10.2); this block only sees plain HTTP.
# /var/www/indusbroadband is a symlink to the active release (see deploy/deploy.sh).
server {
    listen 80;
    server_name indusbroadband.com.pk www.indusbroadband.com.pk;
    root /var/www/indusbroadband;
    index index.html;
    absolute_redirect off;

    # Next 16 export writes segment prefetch files as __next.<seg>/__PAGE__.txt
    # while the client requests __next.<seg>.__PAGE__.txt.
    location ~ ^(?<dir>.*)/__next\.(?<seg>[^/]+)\.__PAGE__\.txt$ {
        try_files $uri $dir/__next.$seg/__PAGE__.txt =404;
    }

    location / { try_files $uri $uri/ $uri.html =404; }
    error_page 404 /404.html;
    location ~ /\. { deny all; }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml application/xml;

    # Hashed build assets never change under the same name.
    location /_next/static/ { expires 1y; add_header Cache-Control "public, immutable"; }
    location ~* \.(?:svg|png|ico|woff2)$ { expires 7d; add_header Cache-Control "public"; }
    location ~* \.(?:html|txt)$ { expires 5m; add_header Cache-Control "public, must-revalidate"; }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    access_log /var/log/nginx/indusbroadband.com.pk.access.log;
}
