# Indus Broadband static site.
# LIVE ON: vm-sites (10.10.10.3) at /etc/nginx/sites-available/indusbroadband.com.pk
# TLS terminates on ct-edge (10.10.10.2); this block only sees plain HTTP.
server {
    listen 80;
    server_name indusbroadband.com.pk www.indusbroadband.com.pk;
    root /var/www/indusbroadband;
    index index.html;
    absolute_redirect off;

    location / { try_files $uri $uri/ =404; }
    location ~ /\. { deny all; }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location ~* \.html$ { expires 10m; add_header Cache-Control "public, must-revalidate"; }
    location ~* \.(?:css|js|png|jpe?g|gif|svg|webp|ico)$ { expires 30d; add_header Cache-Control "public"; }

    access_log /var/log/nginx/indusbroadband.com.pk.access.log;
}
