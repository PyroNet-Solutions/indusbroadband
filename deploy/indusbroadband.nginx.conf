# /etc/nginx/sites-available/indusbroadband.com.pk
server {
    listen 80;
    listen [::]:80;
    server_name indusbroadband.com.pk www.indusbroadband.com.pk;

    root /var/www/indusbroadband;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(png|jpe?g|gif|svg|webp|ico|css|js|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
