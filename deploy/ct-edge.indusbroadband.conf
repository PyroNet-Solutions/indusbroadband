# Indus Broadband edge block.
# LIVE ON: ct-edge (10.10.10.2) at /etc/nginx/sites-available/indusbroadband
# Same pattern as the pyronet.com.pk "sites" block: Cloudflare-only, proxied to vm-sites.
server {
    listen 80;
    listen 8443 ssl proxy_protocol;
    ssl_certificate     /etc/nginx/ssl/indusbroadband-origin.crt;
    ssl_certificate_key /etc/nginx/ssl/indusbroadband-origin.key;
    server_name indusbroadband.com.pk www.indusbroadband.com.pk;

    if ($cf_client = 0) { return 403; }
    # Always use HTTPS: plain-HTTP visitors arrive on :80 (via Cloudflare) and get redirected.
    if ($server_port = 80) { return 301 https://$host$request_uri; }
    location / { proxy_pass http://10.10.10.3; include /etc/nginx/snippets/proxy-common.conf; }
    access_log /var/log/nginx/indusbroadband.access.log;
}
